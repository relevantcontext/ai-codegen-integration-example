<div class="page-item--cart">
  <header class="cart-header">
    <h2 class="cart-title">{{title}}</h2>
    <p class="cart-subtitle">{{subtitle}}</p>
  </header>

  <p class="cart-empty">{{emptyText}}</p>

  <ul class="cart-lines" aria-live="polite"></ul>

  <p class="cart-test-mode" role="note" hidden>{{testModeText}}</p>

  <footer class="cart-summary">
    <p class="cart-total" role="status" aria-live="polite">
      <span class="cart-total__label">{{subtotalLabel}}</span>
      <span class="cart-total__value"></span>
    </p>
    <a class="cart-checkout btn btn-primary" href="#" rel="noopener">{{checkoutLabel}}</a>
  </footer>

  <p class="cart-error" role="alert"></p>
</div>
