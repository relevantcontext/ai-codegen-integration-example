<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asteroid Metals Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
    .catalog__list { list-style: none; padding: 0; display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .catalog__item { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; }
    .catalog__item h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .catalog__meta { margin: 0; color: #666; font-size: .875rem; }
    .catalog__price { margin: .5rem 0 0; font-weight: 600; }
    .catalog__tags { list-style: none; padding: 0; margin: .5rem 0 0;
      display: flex; flex-wrap: wrap; gap: .25rem; }
    .catalog__tags li { background: #eee; border-radius: 999px; padding: .1rem .5rem; font-size: .75rem; }
    .catalog__error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Asteroid Metals</h1>
  <section id="catalog" class="catalog" aria-live="polite"></section>

  <script type="module" src="./main.js"></script>
</body>
</html>
